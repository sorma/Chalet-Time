[versions]
androidx-appcompat = "1.7.0-alpha03"
androidx-material = "1.12.0-alpha03"
androidx-constraintlayout = "2.1.4"
androidx-navigation = "2.7.5"
firebase-auth = "22.3.1"
firebase-firestore = "24.10.1"
androidx-activity = "1.8.2"
junit = "4.13.2"
androidx-test-ext-junit = "1.1.5"
androidx-espresso-core = "3.5.1"

[libraries]
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "androidx-material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "androidx-navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "androidx-navigation" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth", version.ref = "firebase-auth" }
firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebase-firestore" }
activity = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }

[plugins]
android-application = { id = "com.android.application", version = "8.2.2" }
google-services = { id = "com.google.gms.google-services", version = "4.4.0" }